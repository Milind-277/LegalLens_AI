[project]
name = "legallens-ai"
version = "1.0.0"
description = "GenAI-powered legal document assistance"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S", "T20", "RUF"]
ignore = [
    "S101",   # assert used in tests
    "S603",   # subprocess calls (not used)
    "S607",   # partial path (not used)
    "B008",   # function calls in defaults (Flask patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "I001"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*", "app/templates/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]
